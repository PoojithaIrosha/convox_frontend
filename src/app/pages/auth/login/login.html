<section class="auth-card">
  <h1 class="auth-title">Sign in to your workspace</h1>
  <p class="auth-lead">Pick up your WhatsApp, Instagram and Messenger conversations where you left off.</p>

  <form class="mt-7 space-y-5" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (serverError(); as err) {
      <p class="alert alert--error" role="alert">{{ err }}</p>
    }

    <!-- Email -->
    <div>
      <label for="login-email" class="field-label">Email Address</label>
      <input
        id="login-email"
        type="email"
        class="field"
        formControlName="email"
        autocomplete="username"
        inputmode="email"
        placeholder="name@company.com"
        aria-describedby="login-email-error"
      />
    </div>

    <!-- Password -->
    <div>
      <div class="mb-1.5 flex items-baseline justify-between">
        <label for="login-password" class="field-label mb-0">Password</label>
        <a routerLink="/auth/forgot-password" class="lnk text-[0.8rem]">Forgot password?</a>
      </div>
      <div class="relative">
        <input
          id="login-password"
          class="field field--with-action"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          [type]="showPassword() ? 'text' : 'password'"
          aria-describedby="login-password-error login-caps"
          (keydown)="checkCapsLock($event)"
          (keyup)="checkCapsLock($event)"
          (blur)="capsLock.set(false)"
        />
        <button
          type="button"
          class="field-action"
          (click)="togglePassword()"
          [attr.aria-pressed]="showPassword()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          @if (showPassword()) {
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.6 5.1A9.9 9.9 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3.2 4.1M6.4 6.4C3.9 8.1 2.5 12 2.5 12s3.5 7 9.5 7a9.6 9.6 0 0 0 5.6-1.8M9.9 9.9a3 3 0 0 0 4.2 4.2" /></svg>
          } @else {
            <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12Z" /><circle cx="12" cy="12" r="3" /></svg>
          }
        </button>
      </div>
      @if (capsLock()) {
        <p id="login-caps" class="field-warn">Caps Lock is on.</p>
      }
    </div>

    <!-- Remember -->
    <label class="flex cursor-pointer select-none items-center gap-2.5 text-sm text-ink-soft">
      <input type="checkbox" class="check" formControlName="remember" />
      Keep me signed in on this device
    </label>

    <!-- Submit -->
    <button type="submit" class="btn-primary" [disabled]="loading()">
      @if (loading()) {
        <svg class="spinner" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".3" stroke-width="3" /><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round" /></svg>
        Signing in…
      } @else {
        Sign in
      }
    </button>
  </form>

  <div class="divider" aria-hidden="true">or</div>

  <app-social-auth-buttons mode="sign-in" />
</section>

<p class="mt-7 text-center text-sm text-ink-soft">
  New to Convox?
  <a routerLink="/auth/register" class="lnk">Create a workspace</a>
</p>
